apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.indiatv.launcher"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Framework-only build: no support libraries needed for this launcher.
    // androidx.legacy:legacy-support-v4 removed because gradle.properties sets android.useAndroidX=false
    // and the code uses only android.* framework APIs.
}

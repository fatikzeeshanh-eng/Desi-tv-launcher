name: Build APK

on:
  push:
    branches: [ main, build-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Accept Android SDK licenses
        run: mkdir -p $ANDROID_HOME/licenses && printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license

      - name: Install Android SDK 28 components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" > /dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'

      - name: Build debug APK
        run: set -o pipefail; gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-log.txt
          git commit -m "Save build log [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DesiTvOSLauncher-4.4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
